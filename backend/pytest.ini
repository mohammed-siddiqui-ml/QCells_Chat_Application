[pytest]
# Pytest configuration for ChatApplication backend

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test execution
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage settings - LENIENT (30% threshold for task-specific testing)
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-report=term-missing
    --cov-fail-under=30

# Markers for test categorization
markers =
    asyncio: mark test as an async test
    unit: mark test as a unit test
    integration: mark test as an integration test
    database: mark test as requiring database
    requires_postgres: mark test as requiring PostgreSQL with pgvector
    slow: mark test as slow running

# Test paths
testpaths = tests

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
