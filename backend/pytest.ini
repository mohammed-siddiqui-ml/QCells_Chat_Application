[pytest]
# Pytest Configuration for ChatApplication Backend
# Python 3.11+

# Minimum pytest version
minversion = 7.4

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    -l
    # Strict markers - fail on unknown markers
    --strict-markers
    # Strict config - fail on unknown config options
    --strict-config
    # Coverage options
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-branch
    # Minimum coverage threshold (fail if below 80%)
    --cov-fail-under=80
    # Asyncio mode
    --asyncio-mode=auto
    # Show warnings
    -W default
    # Disable cacheprovider warnings
    -p no:warnings

# Asyncio configuration
asyncio_mode = auto

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    e2e: End-to-end tests for complete workflows
    slow: Tests that take significant time to run
    api: API endpoint tests
    database: Database interaction tests
    external: Tests requiring external services
    auth: Authentication and authorization tests
    genai: GenAI and LangChain related tests
    ingestion: Data ingestion tests
    search: Search and retrieval tests

# Coverage configuration
[coverage:run]
source = app
omit =
    */tests/*
    */__pycache__/*
    */venv/*
    */virtualenv/*
    */.venv/*
    */migrations/*
    */alembic/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = htmlcov
