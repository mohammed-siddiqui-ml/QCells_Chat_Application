version: '3.8'

# ============================================================================
# PRODUCTION ENVIRONMENT OVERRIDES
# ============================================================================
# This file provides production-optimized configurations with:
# - Resource limits (CPU and memory)
# - Replica configuration for horizontal scaling
# - Restart policies set to 'always'
# - Optimized environment variables
# - Proper health check configurations
# - No volume mounts for code (baked into images)
#
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
# ============================================================================

services:
  # Backend - Production configuration with replicas
  backend:
    environment:
      LOG_LEVEL: INFO
      ENV: production
      DEBUG: "false"
      RELOAD: "false"
    volumes:
      - backend_logs:/app/logs
      - chroma_data:/app/data/chroma
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --log-level info
    restart: always
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Celery Worker - Production configuration with replicas
  celery-worker:
    environment:
      LOG_LEVEL: INFO
      ENV: production
      DEBUG: "false"
      CELERYD_PREFETCH_MULTIPLIER: "4"
      CELERYD_MAX_TASKS_PER_CHILD: "1000"
    volumes:
      - chroma_data:/app/data/chroma
      - celery_logs:/app/logs/celery
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=8 --max-tasks-per-child=1000 --prefetch-multiplier=4
    restart: always
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Celery Beat - Production configuration
  celery-beat:
    environment:
      LOG_LEVEL: INFO
      ENV: production
      DEBUG: "false"
    volumes:
      - celery_beat_schedule:/app/celerybeat-schedule
    command: celery -A app.tasks.celery_app beat --loglevel=info
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # Frontend - Production configuration
  frontend:
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # PostgreSQL - Production configuration
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # Redis - Production configuration
  redis:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Elasticsearch - Production configuration
  elasticsearch:
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
      - xpack.security.enabled=true
      - xpack.security.enrollment.enabled=false
      - cluster.name=genai-kb-cluster
      - node.name=genai-kb-node
      - bootstrap.memory_lock=true
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  # MinIO - Production configuration
  minio:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  # RabbitMQ - Production configuration
  rabbitmq:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Prometheus - Production configuration
  prometheus:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # Grafana - Production configuration
  grafana:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # Nginx - Production configuration
  nginx:
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  backend_logs:
  chroma_data:
  celery_logs:
  celery_beat_schedule:
